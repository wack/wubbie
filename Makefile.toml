# cargo-make tasks for local development. These mirror the CI gates in
# .github/workflows/ci.yml so `cargo make ci` reproduces CI locally.
[config]
default_to_workspace = false

[env]
CARGO_TERM_COLOR = "always"

[tasks.fmt]
description = "Format the workspace."
command = "cargo"
args = ["fmt", "--all"]

[tasks.check-format]
description = "Check formatting (CI gate)."
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.clippy]
description = "Lint the workspace, denying warnings (CI gate)."
command = "cargo"
args = ["clippy", "--all-targets", "--workspace", "--", "-D", "warnings"]

[tasks.build]
description = "Build the workspace."
command = "cargo"
args = ["build", "--workspace"]

[tasks.test]
description = "Run the test suite."
command = "cargo"
args = ["test", "--workspace"]

[tasks.run]
description = "Run the wubbie CLI (pass args after --)."
command = "cargo"
args = ["run", "-p", "wubbie", "--", "${@}"]

# Full local CI reproduction: format check -> clippy -> build -> test.
[tasks.ci]
description = "Run the full CI gate locally."
dependencies = ["check-format", "clippy", "build", "test"]
