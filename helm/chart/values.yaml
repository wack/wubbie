# Default values for __SERVICE_NAME__.

replicaCount: 1

image:
  repository: ghcr.io/wack/__SERVICE_NAME__
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  # The appVersion is automatically set to the commit SHA during CI,
  # matching the Docker image tag pushed in the same workflow.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Gateway API HTTPRoute configuration
# For DigitalOcean Kubernetes (DOKS), Cilium is the default CNI with Gateway API support.
# The GatewayClass is "cilium" (controller: io.cilium/gateway-controller).
# Create a Gateway with gatewayClassName: cilium, then reference it here.
gateway:
  enabled: false
  annotations: {}
  # Parent Gateway references (the Gateway must use gatewayClassName: cilium on DOKS)
  parentRefs:
    - name: cilium-gateway
      # namespace: default
      # sectionName: https
  # Hostnames to match
  hostnames:
    - __SERVICE_NAME__.local
  # Routing rules
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Database configuration
database:
  # PostgreSQL host (hostname or IP)
  host: ""
  # PostgreSQL port
  port: 5432
  # PostgreSQL database name
  name: "postgres"
  # PostgreSQL username
  user: ""
  # PostgreSQL password
  password: ""
  # Connection acquire timeout in seconds (optional)
  acquireTimeout: ""

# OpenTelemetry configuration
# These fields are REQUIRED for proper observability in production
opentelemetry:
  # OTLP exporter endpoint (e.g., "http://vector:4318" or "http://otel-collector:4318")
  # Leave empty to use the default (http://localhost:4318)
  endpoint: ""
  # Deployment environment (REQUIRED)
  # Valid values: "production", "development", "local"
  environment: "production"
  # API key for authenticating with the OTLP collector
  # Sent as the X-API-KEY header on exporter requests
  # Leave empty to disable API key authentication
  apiKey: ""

# Environment variables
env: []
  # - name: RUST_LOG
  #   value: "info"

# Extra environment variables from secrets/configmaps
envFrom: []
  # - secretRef:
  #     name: my-secret
  # - configMapRef:
  #     name: my-configmap

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /heartbeat
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /heartbeat
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
