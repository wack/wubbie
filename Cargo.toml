[workspace]
resolver = "2"
members = ["crates/wubbie"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/wack/wubbie"

# --- Pinned dependencies (MULTI-1372) ---------------------------------------
# The three pipeline-critical crates are pinned to exact versions (`=`) so a
# clean checkout always resolves the same toolchain of model / tokenizer /
# weight code. Everything else is locked transitively via Cargo.lock.
[workspace.dependencies]
# Burn deep-learning framework. The CPU (`ndarray`) backend is the default and
# is what CI builds; the NVIDIA CUDA backend (CubeCL) is wired behind the
# `cuda` feature on the `wubbie` crate (see crates/wubbie/Cargo.toml).
burn = { version = "=0.21.0", default-features = false }
# HuggingFace tokenizers. Used to train and load the byte-level BPE tokenizer.
tokenizers = { version = "=0.23.1", default-features = false, features = [
  "onig",
  "progressbar",
] }
# safetensors weight (de)serialization. Trained weights live in a separate HF
# model repo; this crate reads/writes the on-disk format.
safetensors = "=0.8.0"

anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
