[workspace]
resolver = "2"
members = ["crates/wubbie"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/wack/wubbie"

# --- Pinned dependencies (MULTI-1372) ---------------------------------------
# The three pipeline-critical crates are pinned to exact versions (`=`) so a
# clean checkout always resolves the same toolchain of model / tokenizer /
# weight code. Everything else is locked transitively via Cargo.lock.
[workspace.dependencies]
# Burn deep-learning framework. The CPU (`ndarray`) backend is the default and
# is what CI builds; the NVIDIA CUDA backend (CubeCL) is wired behind the
# `cuda` feature on the `wubbie` crate (see crates/wubbie/Cargo.toml).
burn = { version = "=0.21.0", default-features = false }
# HuggingFace tokenizers. Used to train and load the byte-level BPE tokenizer.
tokenizers = { version = "=0.23.1", default-features = false, features = [
  "onig",
  "progressbar",
] }
# safetensors weight (de)serialization. Trained weights live in a separate HF
# model repo; this crate reads/writes the on-disk format.
safetensors = "=0.8.0"

anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
derive-getters = "0.5"
# Pure-Rust gzip (miniz_oxide backend, no C) for reading `.jsonl.gz` corpus
# shards.
flate2 = "1.0"
# Pure-Rust Hugging Face Hub client. The filtered CommonPile slice lives on HF
# (MULTI-1378) and is pulled on demand at tokenize/train time; `ureq` is the
# blocking client and `rustls-tls` keeps the TLS stack pure-Rust (no OpenSSL).
hf-hub = { version = "0.5", default-features = false, features = [
  "ureq",
  "rustls-tls",
] }
# Layered configuration: merge file + env + CLI into a fully-specified struct.
figment = { version = "0.10", default-features = false, features = [
  "toml",
  "json",
  "env",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# --- bacon configuration ----------------------------------------------------
# Jobs mirror the CI gate (see CLAUDE.md). `cargo make monitor` runs bacon
# headless and consumes these jobs.
[workspace.metadata.bacon]
default_job = "check"
env.CARGO_TERM_COLOR = "always"

[workspace.metadata.bacon.jobs.check]
command = ["cargo", "check", "--all-targets", "--workspace", "--locked"]
need_stdout = false

[workspace.metadata.bacon.jobs.clippy]
command = [
  "cargo", "clippy", "--all-targets", "--workspace", "--locked",
  "--", "-D", "warnings",
]
need_stdout = false

[workspace.metadata.bacon.jobs.test]
command = [
  "cargo", "nextest", "run", "--workspace", "--locked", "--no-tests=pass",
  "--hide-progress-bar", "--failure-output", "final",
]
need_stdout = true
analyzer = "nextest"
