[workspace]
members = [".", "crates/migrations", "crates/client"]

[workspace.dependencies]
tokio = { version = "1.48.0", features = ["full"] }
chrono = { version = "0.4.42", default-features = false, features = ["serde"] }
opentelemetry = "0.31"
sea-orm-migration = { version = "1.1.7", features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.43"
uuid = { version = "1.0", features = ["serde"] }

# Shared lint policy. Members opt in via `[lints] workspace = true`. Advisory at
# `warn`; the canonical surfaces (`cargo clippy-strict`, the bacon clippy job, CI)
# run `-D warnings`, so any clippy::all violation is blocking there while plain
# `cargo build` stays non-fatal.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[package]
name = "__service_name__"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
readme = "./README.md"
default-run = "__service_name__"

[lints]
workspace = true

[dev-dependencies]
cucumber = { version = "0.21", features = ["tracing"] }

[[test]]
name = "cucumber"
harness = false

[[bin]]
name = "__service_name__"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
blake3 = "1.5"
bon = "3.8.1"
chrono = { workspace = true, features = ["clock"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
data-encoding = "2.6"
miette = { version = "7.6.0", features = ["fancy"] }
nutype = { version = "0.6.2", features = ["serde", "new_unchecked"] }
pretty_assertions = "1.4.1"
rand = "0.9.2"
salvo = { version = "0.88.0", features = [
  "anyhow",
  "cors",
  "oapi",
  "rustls",
  "test",
  "otel",
] }
sea-orm = { version = "1.1.19", features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
] }
serde = { workspace = true }
serde_json = { workspace = true }
static_assertions = "1.1.0"
thiserror = "2.0.17"
tokio = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }
tracing-subscriber = { version = "0.3.22", features = [
  "chrono",
  "env-filter",
  "fmt",
  "json",
  "local-time",
] }
ulid = "1.1"
uuid = { workspace = true, features = ["v4", "v7"] }
zeroize = "1.8"
validator = { version = "0.18", features = ["derive"] }
derive-getters = "0.5.0"
subtle = "2.6.1"
mvc-helpers = { git = "ssh://git@github.com/wack/mvc-helpers.git", branch = "trunk" }
opentelemetry = { workspace = true }
opentelemetry_sdk = { version = "0.31", features = ["experimental_async_runtime", "rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["tonic", "default", "reqwest-rustls"] }

[build-dependencies]
vergen-gitcl = "9"

# Bacon configuration. `cargo make monitor` (or running bacon directly) uses
# `default_job` below. The chain fmt-check -> check -> clippy surfaces the
# first failure that would block CI's `ci-flow`, in the order CI runs them.
# Use `nextest` interactively via the `t` keybinding.
[package.metadata.bacon]
default_job = "fmt-check"
env.CARGO_TERM_COLOR = "always"

[package.metadata.bacon.jobs.fmt-check]
command = ["cargo", "fmt", "--all", "--", "--check"]
need_stdout = false
on_success = "job:check"

[package.metadata.bacon.jobs.check]
command = ["cargo", "check", "--all-targets", "--workspace"]
need_stdout = false
on_success = "job:clippy"

[package.metadata.bacon.jobs.clippy]
command = ["cargo", "clippy-strict"]
need_stdout = false

[package.metadata.bacon.jobs.nextest]
command = [
  "cargo",
  "nextest",
  "run",
  "--workspace",
  "--hide-progress-bar",
  "--failure-output",
  "final",
]
need_stdout = true
analyzer = "nextest"
