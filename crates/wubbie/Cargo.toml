[package]
name = "wubbie"
description = "A fully-open SLM, from corpus to inference — model, training, and inference pipeline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
default-run = "wubbie"

[lints]
workspace = true

[features]
default = ["ndarray"]
# CPU backend (pure Rust, builds everywhere — this is what CI uses).
ndarray = ["burn/ndarray"]
# NVIDIA CUDA backend via CubeCL. Requires the CUDA toolkit at build time, so it
# is intentionally not part of the default build or CI. Build it explicitly with
# `cargo build --features cuda` on a CUDA-capable host.
cuda = ["burn/cuda", "burn/fusion"]

[dependencies]
burn = { workspace = true, features = ["std", "autodiff", "train"] }
tokenizers = { workspace = true }
safetensors = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
derive-getters = { workspace = true }
figment = { workspace = true }
flate2 = { workspace = true }
hf-hub = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# `figment::Jail` (the `test` feature) gives hermetic env/file config tests.
figment = { workspace = true, features = ["test"] }

[[bin]]
name = "wubbie"
path = "src/bin/main.rs"

[lib]
name = "wubbie"
path = "src/lib.rs"
