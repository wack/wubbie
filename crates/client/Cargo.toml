[package]
name = "__SERVICE_NAME__-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "HTTP client for the __SERVICE_NAME__ API, generated from OpenAPI specification"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde"] }
progenitor-client = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde"] }

[build-dependencies]
openapiv3 = "2.0"
progenitor = "0.11"
prettyplease = "0.2"
serde_json = "1.0"
syn = "2.0"

[lints]
workspace = true
